name: Compile Custom SQLite with R-Tree

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-sqlite:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download SQLite Amalgamation Source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-amalgamation-3450300.zip" -OutFile "sqlite.zip"
          Expand-Archive -Path "sqlite.zip" -DestinationPath "."
          $folder = Get-ChildItem -Filter "sqlite-amalgamation-*" | Select-Object -ExpandProperty Name
          Rename-Item $folder sqlite_src

      - name: Compile SQLite with R-Tree on Windows
        shell: cmd
        run: |
          cd sqlite_src
          cl /O2 /DSQLITE_ENABLE_RTREE=1 /DSQLITE_ENABLE_JSON1=1 /DSQLITE_ENABLE_FTS5=1 -LD sqlite3.c -Fesqlite3.dll

      - name: Upload Compiled DLL as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-sqlite-dll
          path: sqlite_src/sqlite3.dll
